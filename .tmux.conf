set -g mouse on

setw -g mode-keys vi

# Enable Tmux to forward OSC 52 sequences to Ghostty
set -s set-clipboard on

# Allow applications inside tmux (like Neovim) to bypass Tmux filters
set -g allow-passthrough on

# change prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# change index to start with 1
set -g base-index 1
set -g pane-base-index 1

# ==========================================
# Cinnamoroll Minimalist Colors
# ==========================================
# Transparent background, soft cloudy text for the main bar
set -g status-style bg=default,fg=#b5c1dd

# Inactive windows (Muted cool blue)
set -g window-status-style fg=#8298b8

# Active window (Bold Sakura Pink, no background block)
set -g window-status-current-style bg=default,fg=#fad1ea,bold

# Pane borders
set -g pane-border-style fg=#565f89
set -g pane-active-border-style fg=#bce4f9

# Command line (Transparent background, Sakura text)
set -g message-style bg=default,fg=#fad1ea,bold
