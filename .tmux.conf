set -g mouse on

setw -g mode-keys vi

# Enable Tmux to forward OSC 52 sequences to Ghostty
set -s set-clipboard on

# Allow applications inside tmux (like Neovim) to bypass Tmux filters
set -g allow-passthrough on

# change prefix
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# change index to start with 1
set -g base-index 1
set -g pane-base-index 1

# ==========================================
# Cinnamoroll Aesthetic Colors
# ==========================================
# Default status bar colors (Deep background, Sky Blue text)
set -g status-style bg=#1a1b26,fg=#90c4fe

# Inactive window title colors (Muted cool blue)
set -g window-status-style fg=#565f89

# Active window title colors (Soft Pink background, Dark text)
set -g window-status-current-style bg=#ffb8d2,fg=#1a1b26,bold

# Pane border colors
set -g pane-border-style fg=#565f89
set -g pane-active-border-style fg=#90c4fe

# Message/Command line colors (When you press prefix + :)
set -g message-style bg=#ffb8d2,fg=#1a1b26,bold
